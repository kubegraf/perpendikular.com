name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing pushes the built site to the gh-pages branch, so the only
# permission needed is contents: write.
#
# The Actions-native path (configure-pages + deploy-pages) is deliberately not
# used here: it needs an OIDC token this repository does not issue, and its
# enablement option calls an admin-only API that GITHUB_TOKEN can never reach.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Custom domain — served from the root, so no base path.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_URL: https://perpendikular.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Check the export looks right
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/og.png
          test -f out/CNAME
          grep -q '"/_next' out/index.html
          echo "export ok: $(find out -type f | wc -l) files"

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to gh-pages"
